
name: Build and Publish Container

on:
  push:
    tags:
      - 'v*'  # e.g. v1.0.0, v2.1.0
  workflow_dispatch:
  
# on:
#  push:
#    branches:
#      - main
#  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Build and push image
        run: |
          docker build \
            -f Containerfile \
            -t "${{ steps.image.outputs.name }}:latest" \
            -t "${{ steps.image.outputs.name }}:${{ github.sha }}" \
            .
          docker push "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"
